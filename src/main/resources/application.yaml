spring:
  application:
    name: helpdesk

  datasource:
    url: jdbc:postgresql://postgres:5432/helpdesk_db
    username: stefano
    password: 1234

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

helpdesk:
  registration:
    enabled: false
  jwt:
    secret: change-this-secret-in-production
    expiration-seconds: 86400
