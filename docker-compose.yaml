services:
  app:
    build: .
    ports:
      - "8080:8080"
    networks:
      - my-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/helpdesk_db
      - SPRING_DATASOURCE_USERNAME=stefano
      - SPRING_DATASOURCE_PASSWORD=1234

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: stefano
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: helpdesk_db
    ports:
      - "5432:5432"
    networks:
      - my-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stefano -d helpdesk_db"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  my-network:
    driver: bridge

volumes:
  postgres-data: