services:
  app:
    build: .
    ports:
      - "8080:8080"
    networks:
      - my-network

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: stefano
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: helpdesk_db
    ports:
      - "5432:5432"
    networks:
      - my-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/db/init:/docker-entrypoint-initdb.d

networks:
  my-network:
    driver: bridge

volumes:
  postgres-data:
